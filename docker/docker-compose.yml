version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: evote-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: evote
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine
    container_name: evote-cache
    ports:
      - "6379:6379"        

volumes: 
  postgres_data: